  <style>

      margin-top: 6px;

  </style>

<body>

  <!-- EN-TÊTE -->
  <header>
    <div>
      <h1 class="app-title">Semaine d'Entraînement</h1>
      <p style="font-size:12px; color:var(--text-muted);">Clique sur un jour pour voir la séance</p>
    </div>
  </header>

  <!-- VUE 1 : WORKOUT -->
  <main id="view-workout" class="tab-view active">

    <!-- Switch Semaine A / Semaine B -->
    <div class="cycle-bar">
      <button class="cycle-btn active" id="btn-cycle-a" onclick="setCycle('A')">⚡ Semaine A (Jambes)</button>
      <button class="cycle-btn" id="btn-cycle-b" onclick="setCycle('B')">🔥 Semaine B (Sprints)</button>
    </div>

    <!-- Sélecteur des 7 jours de la semaine -->
    <div class="week-strip" id="week-strip"></div>

    <!-- Carte de la séance sélectionnée -->
    <section class="card" id="session-card">
      <div class="session-header">
        <div>
          <h2 class="session-title" id="card-day-title">Lundi</h2>
          <p class="session-sub" id="card-day-sub">Pecs / Dos / Épaules</p>
        </div>
        <span class="badge" id="card-day-badge">Haut A</span>
      </div>

      <!-- Liste des exercices à cocher -->
      <div class="exercise-list" id="card-exercises"></div>

      <button class="btn btn-secondary" onclick="addExercisePrompt()">
        ＋ Ajouter un exercice
      </button>

      <!-- Évaluation de la séance -->
      <div class="rating-section">
        <div class="slider-labels">
          <span>Ressenti : <strong id="rate-num">7</strong>/10</span>
          <span class="tag-intensity" id="rate-tag">Bonne séance</span>
        </div>
        <input type="range" id="rate-slider" min="1" max="10" value="7" oninput="setIntensity(this.value)">

        <button class="btn btn-share" onclick="sendProof()">
          📸 Partager ma story / preuve (Snap/Insta)
        </button>
      </div>
    </section>

    <!-- Chrono & Repos -->
    <section class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="font-size:16px;">⏱️ Timer Repos</h3>
        <span id="timer-status" style="font-size:12px; color:var(--text-muted);">Prêt</span>
      </div>

      <div class="timer-val" id="timer-val">01:30</div>

      <div class="timer-chips">
        <button class="time-chip" onclick="setTimePreset(30)">+30s</button>
        <button class="time-chip" onclick="setTimePreset(60)">+60s</button>
        <button class="time-chip" onclick="setTimePreset(90)">+90s</button>
        <button class="time-chip" onclick="setTimePreset(120)">+2m</button>
      </div>

      <div style="display:flex; gap:10px;">
        <button class="btn" id="timer-toggle-btn" style="background:var(--accent); color:#04101e;" onclick="toggleTimer()">Démarrer</button>
        <button class="btn btn-secondary" onclick="resetTimer()">Reset</button>
      </div>
    </section>
  </main>

  <!-- VUE 2 : PROFIL & STATS -->
  <main id="view-profile" class="tab-view">
    <section class="card">
      <h3 style="font-size:17px; margin-bottom:12px;">📊 Métriques Physiques</h3>
      <label style="font-size:13px; color:var(--text-muted);">Poids (kg)</label>
      <input type="number" id="inp-weight" placeholder="Ex: 75" onchange="saveProfileData()">

      <label style="font-size:13px; color:var(--text-muted);">Taille (cm)</label>
      <input type="number" id="inp-height" placeholder="Ex: 178" onchange="saveProfileData()">

      <button class="btn" style="background:var(--accent); color:#04101e;" onclick="calcStats()">Calculer</button>

      <div id="stats-out" style="margin-top:14px; font-size:14px; line-height:1.8;"></div>
    </section>

    <section class="card">
      <h3 style="font-size:17px; margin-bottom:12px;">🎯 Objectifs</h3>
      <input type="text" id="inp-goal" placeholder="Ex: Développé 80kg, 10 tractions...">
      <button class="btn btn-secondary" onclick="addGoal()">Ajouter</button>
      <ul id="goal-list" style="margin-top:14px; padding-left:20px; font-size:14px; line-height:1.8;"></ul>
    </section>
  </main>

  <!-- BARRE DE NAVIGATION -->
  <nav class="nav-bar">
    <button class="nav-btn active" onclick="switchNav('workout', this)">
      <svg viewBox="0 0 24 24"><path d="M6 4v16M18 4v16M2 8h4M18 8h4M2 16h4M18 16h4M6 12h12"/></svg>
      Programme
    </button>
    <button class="nav-btn" onclick="switchNav('profile', this)">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profil & Stats
    </button>
  </nav>

  <script>
    let currentCycle = 'A';
    const daysConfig = [
      { id: 1, label: "Lun", full: "Lundi", icon: "💪" },
      { id: 2, label: "Mar", full: "Mardi", icon: "⚡" },
      { id: 3, label: "Mer", full: "Mercredi", icon: "🏊" },
      { id: 4, label: "Jeu", full: "Jeudi", icon: "💤" },
      { id: 5, label: "Ven", full: "Vendredi", icon: "🏋️" },
      { id: 6, label: "Sam", full: "Samedi", icon: "🛡️" },
      { id: 0, label: "Dim", full: "Dimanche", icon: "🔋" }
    ];

    const todayDayIndex = new Date().getDay();
    let selectedDayId = todayDayIndex;

    const baseProgram = {
      1: { title: "Haut du Corps A", badge: "Poussée / Pecs", sub: "Pecs, épaules et triceps avec rappel dos", list: ["Développé incliné haltères (4x8-10)", "Dips ou Développé couché (3x10)", "Rowing buste appuyé (4x10)", "Élévations latérales (4x15)", "Triceps poulie (3x12)"] },
      2: {
        A: { title: "Bas du Corps (Lourd)", badge: "Jambes salle", sub: "Machines guidées pour épargner le dos", list: ["Presse à cuisses ou Hack squat (4x10)", "Leg curl ischios (4x12)", "Hip thrust fessiers (3x10)", "Mollets debout (4x15)"] },
        B: { isSprint: true, title: "Sprints & Piste", badge: "Cardio Vitesse", sub: "Explosivité & VO2max", list: ["Échauffement gammes athlétiques (15 min)", "Sprint 1 (50m)", "Sprint 2 (50m)", "Sprint 3 (50m)", "Sprint 4 (60m)", "Sprint 5 (60m)"] }
      },
      3: { title: "Natation & Récup", badge: "Décompression", sub: "Décharge complète de la colonne et jambes", list: ["35 à 45 min Nage libre / Dos", "Étirements légers et respiration"] },
      4: { title: "Repos Complet", badge: "Recharge", sub: "Hydratation, bonne alimentation, zéro sport", list: ["Repos total avant la fin de semaine"] },
      5: { title: "Haut du Corps B", badge: "Tirage / Dos", sub: "Tractions, rowing, épaules et biceps", list: ["Tractions ou Tirage vertical (4x8-10)", "Rowing unilatéral haltère (3x10)", "Développé militaire épaules (3x10)", "Curl biceps marteau (4x12)", "Face-pull poulie (3x15)"] },
      6: { title: "Abdos & Lombaires", badge: "Gainage & Posture", sub: "Renforcement pour protéger le dos au travail", list: ["Banc à lombaires à 45° (3x12)", "Relevés de jambes suspendu (3x15)", "Crunch poulie ou sol (3x15)", "Gainage ventral planche (3x1 min)"] },
      0: { title: "Repos Complet", badge: "Reset", sub: "Récupération totale avant la semaine suivante", list: ["Dormir et se relaxer"] }
    };

    function renderWeekStrip() {
      const strip = document.getElementById('week-strip');
      strip.innerHTML = '';
      daysConfig.forEach(d => {
        const isSelected = d.id === selectedDayId;
        const isToday = d.id === todayDayIndex;
        strip.innerHTML += `
          <div class="day-pill ${isSelected ? 'active' : ''}" onclick="selectDay(${d.id})">
            ${isToday ? '<div class="today-dot"></div>' : ''}
            <span class="day-name">${d.label}</span>
            <span class="day-icon">${d.icon}</span>
          </div>`;
      });
    }

    function selectDay(dayId) {
      selectedDayId = dayId;
      renderWeekStrip();
      renderSelectedDay();
    }

    function setCycle(c) {
      currentCycle = c;
      document.getElementById('btn-cycle-a').classList.toggle('active', c === 'A');
      document.getElementById('btn-cycle-b').classList.toggle('active', c === 'B');
      renderSelectedDay();
    }

    function renderSelectedDay() {
      const dayConf = daysConfig.find(d => d.id === selectedDayId);
      let session = baseProgram[selectedDayId];
      if (selectedDayId === 2) session = session[currentCycle];

      document.getElementById('card-day-title').innerText = `${dayConf.full} — ${session.title}`;
      document.getElementById('card-day-sub').innerText = session.sub;
      document.getElementById('card-day-badge').innerText = session.badge;

      const container = document.getElementById('card-exercises');
      container.innerHTML = '';

      session.list.forEach((ex, idx) => {
        const checkKey = `done_${currentCycle}_${selectedDayId}_${idx}`;
        const isChecked = localStorage.getItem(checkKey) === 'true';

        let sprintHtml = '';
        if (session.isSprint && idx > 0) {
          const sprintKey = `time_${currentCycle}_${selectedDayId}_${idx}`;
          const val = localStorage.getItem(sprintKey) || '';
          sprintHtml = `<input class="sprint-chip" type="number" step="0.01" placeholder="sec" value="${val}" onchange="localStorage.setItem('${sprintKey}', this.value)">`;
        }

        container.innerHTML += `
          <div class="exercise-row ${isChecked ? 'done' : ''}" id="row-${idx}">
            <div class="exercise-left">
              <input type="checkbox" class="custom-check" ${isChecked ? 'checked' : ''} onchange="toggleExerciseCheck(${idx}, this.checked)">
              <span>${ex}</span>
            </div>
            ${sprintHtml}
            <button onclick="deleteExercise(${idx})" style="background:none; border:none; color:#f43f5e; font-size:16px; cursor:pointer;">✕</button>
          </div>`;
      });
    }

    function toggleExerciseCheck(idx, checked) {
      const checkKey = `done_${currentCycle}_${selectedDayId}_${idx}`;
      localStorage.setItem(checkKey, checked);
      document.getElementById(`row-${idx}`).classList.toggle('done', checked);
    }

    function addExercisePrompt() {
      const val = prompt("Nouvel exercice (ex: Développé couché 4x10) :");
      if (val) {
        let session = baseProgram[selectedDayId];
        if (selectedDayId === 2) session = session[currentCycle];
        session.list.push(val);
        renderSelectedDay();
      }
    }

    function deleteExercise(idx) {
      let session = baseProgram[selectedDayId];
      if (selectedDayId === 2) session = session[currentCycle];
      session.list.splice(idx, 1);
      renderSelectedDay();
    }

    function setIntensity(val) {
      document.getElementById('rate-num').innerText = val;
      const tag = document.getElementById('rate-tag');
      if (val <= 4) {
        tag.innerText = "Léger / Récup";
        tag.style.background = "rgba(34, 197, 94, 0.2)";
        tag.style.color = "#4ade80";
      } else if (val <= 7) {
        tag.innerText = "Bonne séance";
        tag.style.background = "rgba(245, 158, 11, 0.2)";
        tag.style.color = "#fbbf24";
      } else {
        tag.innerText = "Séance destruction 🔥";
        tag.style.background = "rgba(239, 68, 68, 0.2)";
        tag.style.color = "#f87171";
      }
    }

    function sendProof() {
      const note = document.getElementById('rate-slider').value;
      const dayConf = daysConfig.find(d => d.id === selectedDayId);
      const text = `Séance du ${dayConf.full} validée ! Ressenti : ${note}/10 💪 #Discipline`;
      if (navigator.share) {
        navigator.share({ title: 'Workout Tracker', text: text }).catch(() => {});
      } else {
        navigator.clipboard.writeText(text);
        alert("Texte copié ! Tu peux le coller direct dans ta story Snap / Insta !");
      }
    }

    /* TIMER */
    let tDuration = 90;
    let tRemain = 90;
    let tInt = null;
    let isRunning = false;

    function fmt(s) {
      const m = Math.floor(s / 60).toString().padStart(2, '0');
      const sec = (s % 60).toString().padStart(2, '0');
      return `${m}:${sec}`;
    }

    function setTimePreset(s) {
      clearInterval(tInt);
      isRunning = false;
      document.getElementById('timer-toggle-btn').innerText = "Démarrer";
      document.getElementById('timer-status').innerText = "Prêt";
      tDuration = s;
      tRemain = s;
      document.getElementById('timer-val').innerText = fmt(tRemain);
    }

    function toggleTimer() {
      const btn = document.getElementById('timer-toggle-btn');
      if (isRunning) {
        clearInterval(tInt);
        isRunning = false;
        btn.innerText = "Reprendre";
        document.getElementById('timer-status').innerText = "Pause";
      } else {
        isRunning = true;
        btn.innerText = "Pause";
        document.getElementById('timer-status').innerText = "En cours...";
        tInt = setInterval(() => {
          if (tRemain > 0) {
            tRemain--;
            document.getElementById('timer-val').innerText = fmt(tRemain);
          } else {
            clearInterval(tInt);
            isRunning = false;
            btn.innerText = "Démarrer";
            document.getElementById('timer-status').innerText = "Terminé !";
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            alert("⏰ Fin du temps de repos !");
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(tInt);
      isRunning = false;
      tRemain = tDuration;
      document.getElementById('timer-toggle-btn').innerText = "Démarrer";
      document.getElementById('timer-status').innerText = "Prêt";
      document.getElementById('timer-val').innerText = fmt(tRemain);
    }

    /* PROFIL */
    function calcStats() {
      const w = parseFloat(document.getElementById('inp-weight').value);
      const h = parseFloat(document.getElementById('inp-height').value) / 100;
      if (!w || !h) return alert("Indique ton poids et ta taille !");

      const imc = (w / (h * h)).toFixed(1);
      const bmr = Math.round(10 * w + 6.25 * (h * 100) - 5 * 25 + 5);
      const tdee = Math.round(bmr * 1.55);

      document.getElementById('stats-out').innerHTML = `
        🔹 <strong>IMC :</strong> ${imc}<br>
        🔹 <strong>Métabolisme de base :</strong> ~${bmr} kcal/j<br>
        🔹 <strong>Maintien avec travail actif :</strong> ~${tdee} kcal/j
      `;
    }

    function saveProfileData() {
      localStorage.setItem('u_w', document.getElementById('inp-weight').value);
      localStorage.setItem('u_h', document.getElementById('inp-height').value);
    }

    function addGoal() {
      const inp = document.getElementById('inp-goal');
      if (!inp.value) return;
      let g = JSON.parse(localStorage.getItem('my_goals') || '[]');
      g.push(inp.value);
      localStorage.setItem('my_goals', JSON.stringify(g));
      inp.value = '';
      loadGoalsList();
    }

    function loadGoalsList() {
      const ul = document.getElementById('goal-list');
      let g = JSON.parse(localStorage.getItem('my_goals') || '[]');
      ul.innerHTML = g.map((item, i) => `<li>${item} <button onclick="delGoal(${i})" style="background:none; border:none; color:#f43f5e; cursor:pointer;">✕</button></li>`).join('');
    }

    function delGoal(i) {
      let g = JSON.parse(localStorage.getItem('my_goals') || '[]');
      g.splice(i, 1);
      localStorage.setItem('my_goals', JSON.stringify(g));
      loadGoalsList();
    }

    function switchNav(view, btn) {
      document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`view-${view}`).classList.add('active');
      btn.classList.add('active');
    }

    // Lancement
    setIntensity(7);
    renderWeekStrip();
    renderSelectedDay();
    loadGoalsList();
    if (localStorage.getItem('u_w')) document.getElementById('inp-weight').value = localStorage.getItem('u_w');
    if (localStorage.getItem('u_h')) document.getElementById('inp-height').value = localStorage.getItem('u_h');
  </script>
</body>
</html>
